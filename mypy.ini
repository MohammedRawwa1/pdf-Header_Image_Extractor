# Mypy type checking configuration
# https://mypy.readthedocs.io/en/stable/config_file.html
#
# Scope: the shared/typed utility modules only.  The rest of the codebase is
# (mostly) untyped — expand `files` as more modules get annotations.
#
# `follow_imports = skip` keeps the check on the declared files instead of
# pulling in the entire (untyped) module graph; `ignore_missing_imports`
# tolerates third-party libraries without stubs (telethon, pyrogram, PTB...).

[mypy]
python_version = 3.11
files = utils/tg_http.py, utils/progress_tracker.py
follow_imports = skip
ignore_missing_imports = True
warn_unused_ignores = True
