# 🔒 Security Scan Pipeline
# Runs on every push and pull request to main.
# Performs: Bandit static analysis, pip-audit dependency scanning,
# Python syntax validation, OWASP leak pattern detection,
# and TruffleHog secret scanning for leaked credentials.
#
# Usage:
#   - Runs automatically on push/PR to main
#   - Can be triggered manually via GitHub Actions tab
#   - Results appear as PR check annotations

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"

jobs:
  security-scan:
    name: "Bandit + pip-audit + Ruff Lint + Static Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate .bandit config
        run: |
          python -c "
          import os, yaml
          config_path = '.bandit'
          if not os.path.exists(config_path):
              print('⚠️  .bandit config not found — using Bandit defaults')
          else:
              with open(config_path) as f:
                  config = yaml.safe_load(f)
              skips = config.get('skips', [])
              print(f'✅ .bandit config valid: {len(skips)} skips configured ({skips})')
          "

      - name: Run Bandit security scan
        run: |
          BANDIT_ARGS=""
          if [ -f .bandit ]; then
            BANDIT_ARGS="-c .bandit"
            echo "Using .bandit config"
          else
            echo "No .bandit config found — using Bandit defaults"
          fi
          python -m bandit $BANDIT_ARGS -r . -f json -o bandit-report.json 2>&1 || true
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          if results:
              print(f'::warning::Bandit found {len(results)} issue(s)')
              for r in results:
                  print(f\"  [{r['issue_severity']}] {r['test_id']}: {r['filename']}:{r['line_number']} - {r['issue_text']}\")
          else:
              print('✅ Bandit: 0 findings')
          # Fail only on high-severity findings
          highs = [r for r in results if r.get('issue_severity') == 'HIGH']
          if highs:
              print(f'::error::Bandit found {len(highs)} HIGH-severity issue(s)!')
              sys.exit(1)
          "

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run pip-audit dependency scan
        run: |
          python -m pip_audit --requirement requirements.txt --desc 2>&1 | tee pip-audit-output.txt
          if grep -q "No known vulnerabilities found" pip-audit-output.txt; then
            echo "✅ pip-audit: 0 known vulnerabilities"
          else
            echo "::warning::pip-audit found vulnerabilities! Check output above."
          fi

      - name: Run Ruff linter with security rules
        run: |
          echo "Running Ruff linter (syntax + security rules)..."
          python -m ruff check . --output-format github
          echo "✅ Ruff: no issues found"

      - name: Run mypy type check (typed utils modules)
        run: |
          echo "Running mypy on typed modules (utils/tg_http.py, utils/progress_tracker.py)..."
          python -m mypy
          echo "✅ mypy: no type issues found"

      - name: Run static audit (wrong-kwarg + un-awaited async)
        run: |
          echo "Running static AST audit for wrong-kwarg calls and un-awaited async calls..."
          python scripts/audit_static.py .

      - name: Check for OWASP exception leak patterns
        run: |
          echo "Checking for exception disclosure patterns..."
          patterns_found=0
          for pattern in 'exc\.__class__\.__name__' 'HTTPException.*detail.*str\(e\)' 'allow_redirects=True'; do
            matches=$(grep -rn "$pattern" --include="*.py" . 2>/dev/null | grep -v ".venv" | grep -v "env/" | grep -v "__pycache__" || true)
            if [ -n "$matches" ]; then
              echo "::warning::Found pattern '$pattern':"
              echo "$matches"
              patterns_found=$((patterns_found + 1))
            fi
          done
          if [ $patterns_found -eq 0 ]; then
            echo "✅ No OWASP exception leak patterns found"
          else
            echo "::warning::$patterns_found OWASP leak pattern(s) detected — review above"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "   🔒 SECURITY SCAN SUMMARY"
          echo "═══════════════════════════════════════"
          echo "  Bandit:       $(python -c "import json; d=json.load(open('bandit-report.json')); print(f'{len(d[\"results\"])} findings')" 2>/dev/null || echo "skipped")"
          echo "  pip-audit:    $(grep -c 'No known vulnerabilities' pip-audit-output.txt 2>/dev/null | xargs -I{} echo 'clean')"
          echo "  Ruff Lint:    $(python -m ruff check . --config ruff.toml --statistics 2>&1 | tail -n 2 || echo "done")"
          echo "  Static audit: $(python scripts/audit_static.py . > /dev/null 2>&1 && echo 'clean' || echo 'FAILED')"
          echo "  Leak patterns: checked"
          echo "═══════════════════════════════════════"
          echo ""

  scripts-validation:
    name: "🧹 Scripts validation (clear_jobs.py)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check scripts/clear_jobs.py
        run: python -m py_compile scripts/clear_jobs.py

      - name: Ruff lint scripts/clear_jobs.py
        run: python -m ruff check scripts/clear_jobs.py

      - name: Functional smoke test (clear_jobs.py against fake Redis)
        run: |
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, 'scripts')
          import clear_jobs as cj

          class FakeRedis:
              def __init__(self):
                  self.store = {}
              def keys(self, pat):
                  import fnmatch
                  return [k for k in self.store if fnmatch.fnmatch(k, pat)]
              def lrange(self, k, a, b):
                  return self.store.get(k, [])[a:b if b >= 0 else None]
              def zrange(self, k, a, b):
                  return list(self.store.get(k, {}).keys())[a:b if b >= 0 else None]
              def lrem(self, k, c, v):
                  lst = self.store.get(k, [])
                  n = lst.count(v)
                  self.store[k] = [x for x in lst if x != v]
                  return n
              def zrem(self, k, v):
                  d = self.store.get(k, {})
                  return d.pop(v, None) is not None
              def llen(self, k):
                  return len(self.store.get(k, []))
              def zcard(self, k):
                  return len(self.store.get(k, {}))
              def exists(self, k):
                  return k in self.store
              def delete(self, *ks):
                  n = 0
                  for k in ks:
                      if k in self.store:
                          del self.store[k]
                          n += 1
                  return n
              def scan_iter(self, pat, count=100):
                  return iter(self.keys(pat))

          r = FakeRedis()
          r.store['rq:queue:default'] = ['jobA', 'jobB']
          r.store['rq:job:jobA'] = {'data': 'x'}
          r.store['rq:wip:default'] = {'jobB': 1.0}
          r.store['pdf:jobs'] = [
              json.dumps({'job_id': 'jobA', 'original_filename': 'a.pdf'}),
              json.dumps({'job_id': 'jobC'}),
          ]
          r.store['pdf:delayed'] = {json.dumps({'job_id': 'jobB'}): 2.0}
          r.store['pdf:job:jobA'] = {'status': 'queued'}
          r.store['pdf:progress:jobA'] = {'x': 1}
          r.store['progress:jobA'] = {'x': 1}
          r.store['io:out:jobA'] = {'x': 1}
          r.store['cancel:jobA'] = '1'

          n = cj.clear_job(r, 'jobA')
          print('cleared count:', n)
          assert 'jobA' not in r.store.get('rq:queue:default', [])
          assert 'rq:job:jobA' not in r.store
          assert all(json.loads(x)['job_id'] != 'jobA' for x in r.store['pdf:jobs'])
          assert 'pdf:job:jobA' not in r.store
          assert 'progress:jobA' not in r.store
          assert 'cancel:jobA' not in r.store
          assert r.store.get('rq:wip:default') == {'jobB': 1.0}  # untouched
          print('SMOKE_OK')
          EOF

      - name: Functional smoke test (S3 input purge)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          import clear_jobs as cj

          # Fake S3 client stub: list_objects_v2 + delete_object
          class FakeS3:
              def __init__(self, keys):
                  self.keys = list(keys)
                  self.deleted = []
              def get_paginator(self, name):
                  return self
              def paginate(self, Bucket, Prefix):
                  matching = [k for k in self.keys if k.startswith(Prefix)]
                  return [{'Contents': [{'Key': k} for k in matching]}] if matching else [{}]
              def delete_object(self, Bucket, Key):
                  self.deleted.append(Key)

          fake = FakeS3(['inputs/jobX/source', 'inputs/jobY/source', 'pdf-bot/other'])
          cj._s3_client = lambda: (fake, 'test-bucket')

          n = cj.purge_s3_inputs('inputs/')
          print('S3 purged:', n)
          assert n == 2, f'expected 2 deletes, got {n}'
          assert set(fake.deleted) == {'inputs/jobX/source', 'inputs/jobY/source'}
          print('S3_SMOKE_OK')
          EOF

  secret-scan:
    name: "🔑 TruffleHog Secret Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to scan full git history

      - name: Run TruffleHog secret scanner
        uses: docker://trufflesecurity/trufflehog:latest
        with:
          args: >-
            git file://.
            --only-verified
            --fail
            --no-update

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::🔑 TruffleHog detected verified secrets in the repository!"
          echo "Review the logs above to see which credentials were leaked."