## Render service manifest (example)
## Replace placeholder values before deploying.

services:
  - type: web
    name: pdf-header-image-bot
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    # Run both the web server and an in-process worker in the same container.
    # This avoids paying for a separate worker service by launching the worker
    # in the background while uvicorn runs in the foreground.
    # NOTE: This is suitable for low-volume usage. For production or scaling,
    # run a separate worker service.
    # Start only the web server here; the in-process worker will be started
    # from the web app when RUN_WORKER_IN_PROC=true is set. This avoids a
    # separate paid worker service while ensuring worker logs appear in the
    # same Render logs stream.
    startCommand: "sh -lc 'exec uvicorn bot:app --host 0.0.0.0 --port $PORT --log-level ${LOG_LEVEL:-info}'"
    healthCheckPath: "/health"
    envVars:
      - key: BOT_TOKEN
        value: "<REPLACE_WITH_BOT_TOKEN>"
      - key: WEBHOOK_URL
        value: "https://<your-service>.onrender.com"
      - key: USE_POLLING
        value: "false"
      - key: ADMIN_USERS
        value: ""
      - key: ADMIN_SECRET
        value: "<REPLACE_WITH_STRONG_SECRET>"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: LOG_LEVEL
        value: "DEBUG"
      - key: RUN_WORKER_IN_PROC
        value: "true"
      - key: LOG_LEVEL
        value: "DEBUG"
      - key: LOG_CHANNEL
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: TMP_DIR
        value: "/tmp"
      - key: MAX_FILE_SIZE
        value: "524288000"
  - type: worker
    name: pdf-header-image-worker
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    # RQ background worker: processes process_document_job, process_url_job, etc.
    startCommand: "python worker.py"
    envVars:
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: BOT_TOKEN
        value: "<REPLACE_WITH_BOT_TOKEN>"
      - key: LOG_CHANNEL
        value: ""
      - key: TMP_DIR
        value: "/tmp"
      - key: MAX_FILE_SIZE
        value: "524288000"

  - type: worker
    name: pdf-header-image-pipeline-worker
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    # Pipeline worker: consumes jobs from the BigFilePipeline Redis queue
    # (pdf:jobs list) and processes them via process_input_key_job.
    # This handles the S3 pipeline path for very large files.
    startCommand: "python pipeline_worker.py"
    envVars:
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: BOT_TOKEN
        value: "<REPLACE_WITH_BOT_TOKEN>"
      - key: S3_BUCKET
        value: "<REPLACE_WITH_S3_BUCKET>"
      - key: S3_REGION
        value: "<REPLACE_WITH_S3_REGION>"
      - key: AWS_ACCESS_KEY_ID
        value: "<REPLACE_WITH_AWS_ACCESS_KEY>"
      - key: AWS_SECRET_ACCESS_KEY
        value: "<REPLACE_WITH_AWS_SECRET>"
      - key: LOG_CHANNEL
        value: ""
      - key: TMP_DIR
        value: "/tmp"
      - key: MAX_FILE_SIZE
        value: "524288000"
