## Render service manifest (example)
## Replace placeholder values before deploying.

services:
  - type: web
    name: pdf-header-image-bot
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    # Run both the web server and an in-process worker in the same container.
    # This avoids paying for a separate worker service by launching the worker
    # in the background while uvicorn runs in the foreground.
    # NOTE: This is suitable for low-volume usage. For production or scaling,
    # run a separate worker service.
    # Use LOG_LEVEL env var to control uvicorn log level; default to info
    startCommand: "sh -lc 'python worker.py & exec uvicorn bot:app --host 0.0.0.0 --port $PORT --log-level ${LOG_LEVEL:-info}'"
    healthCheckPath: "/health"
    envVars:
      - key: BOT_TOKEN
        value: "<REPLACE_WITH_BOT_TOKEN>"
      - key: WEBHOOK_URL
        value: "https://<your-service>.onrender.com"
      - key: USE_POLLING
        value: "false"
      - key: ADMIN_USERS
        value: ""
      - key: ADMIN_SECRET
        value: "<REPLACE_WITH_STRONG_SECRET>"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: LOG_LEVEL
        value: "DEBUG"
      - key: LOG_CHANNEL
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: MAX_FILE_SIZE
        value: "52428800"
  - type: worker
    name: pdf-header-image-worker
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    # If you prefer a separate worker service, keep this. Otherwise remove
    # the worker service block and run the worker in the web container.
    startCommand: "python worker.py"
    envVars:
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: BOT_TOKEN
        value: "<REPLACE_WITH_BOT_TOKEN>"
      - key: LOG_CHANNEL
        value: ""
      - key: MAX_FILE_SIZE
        value: "52428800"
